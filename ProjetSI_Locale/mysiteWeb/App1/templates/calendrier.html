<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier</title>
</head>
<body>
    <h1>Liste des utilisateurs dans la Whitelist</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Mail</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody>
            {% for item in whitelist_items %}
            <tr>
                <td>{{ item.mail }}</td>
                <td>{{ item.statut }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2">Aucun utilisateur dans la whitelist.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
