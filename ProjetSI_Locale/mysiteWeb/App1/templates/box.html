{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Sélectionnez une Box</title>
    <link rel="stylesheet" href="{% static 'box.css'%}">
</head>
<body>
    <h1>Choisissez une Box</h1>
    <form method="POST" action="">
        {% csrf_token %}
        {% for box in boxes %}
            <button type="submit" name="box" value="{{ box.id }}">{{ box.name }}</button>
        {% endfor %}
    </form>
</body>
</html>
