{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choix Admin</title>
    <link rel="stylesheet" href="{% static 'css/choixadmin.css'%}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
   
</head>
<body>
    <h1>Choisissez une fonctionnalité</h1>
    <form method="POST">
        {% csrf_token %}
        {% for fonctionnalitée in fonctionnalitées %}
            <button type="submit" name="choixAdmin" value="{{ fonctionnalitée.id }}">{{ fonctionnalitée.name }}</button>
        {% endfor %}
        <button href="{% url 'index' %}">Retour à l'accueil</button>
    </form>
</body>
</html>
